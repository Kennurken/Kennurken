<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img"><defs><style>
.s{font-family:'Inter','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,ui-monospace,Menlo,monospace}
@keyframes flow{to{stroke-dashoffset:-20}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes rise{from{opacity:0}to{opacity:1}}
.ln{opacity:0;animation:rise .45s ease-out forwards}
@keyframes blink{50%{opacity:0}}.cur{animation:blink 1s step-end infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:900;animation:draw 4s ease-out infinite alternate}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:163}}
.ring{stroke-dasharray:163;animation:ring 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ln{opacity:1}}
</style></defs><text x="0" y="42" class="m" font-size="14" font-weight="700" fill="#00C9A7" text-anchor="start" >04</text><text x="38" y="42" class="s" font-size="24" font-weight="750" fill="#E8EDF2" text-anchor="start" letter-spacing="-.5">Activity</text><line x1="162" y1="36" x2="879" y2="36" stroke="#222A35"/><text x="1000" y="41" class="m" font-size="13" font-weight="400" fill="#8E99A6" text-anchor="end" >updated daily</text></svg>
