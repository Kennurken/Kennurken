<svg xmlns="http://www.w3.org/2000/svg" width="480" height="168" viewBox="0 0 480 168" role="img"><defs><style>
.s{font-family:'Inter','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,ui-monospace,Menlo,monospace}
@keyframes flow{to{stroke-dashoffset:-20}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes rise{from{opacity:0}to{opacity:1}}
.ln{opacity:0;animation:rise .45s ease-out forwards}
@keyframes blink{50%{opacity:0}}.cur{animation:blink 1s step-end infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:900;animation:draw 4s ease-out infinite alternate}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:163}}
.ring{stroke-dasharray:163;animation:ring 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ln{opacity:1}}
</style><pattern id="td" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#B4BDC8" opacity=".55"/></pattern><radialGradient id="tg" cx="100%" cy="0%" r="65%"><stop offset="0" stop-color="#00C9A7" stop-opacity="0.128"/><stop offset="1" stop-color="#00C9A7" stop-opacity="0"/></radialGradient><clipPath id="ctd"><rect x="1" y="1" width="478" height="166" rx="16"/></clipPath></defs><g clip-path="url(#ctd)"><rect width="480" height="168" fill="#FFFFFF"/><rect width="480" height="168" fill="url(#td)"/><rect width="480" height="168" fill="url(#tg)"/></g><rect x="1" y="1" width="478" height="166" rx="16" fill="none" stroke="#D9DFE6"/><rect x="24" y="30" width="10" height="10" rx="2" fill="#00C9A7"/><text x="44" y="40" class="s" font-size="21" font-weight="750" fill="#141A21" text-anchor="start" letter-spacing="-.4">+ more</text><text x="456" y="39" class="m" font-size="11.5" font-weight="400" fill="#5A6573" text-anchor="end" >16 public repos</text><text x="24" y="80" class="s" font-size="14.5" font-weight="400" fill="#5A6573" text-anchor="start" >Flutter apps, FastAPI services, CLI tools,</text><text x="24" y="102" class="s" font-size="14.5" font-weight="400" fill="#5A6573" text-anchor="start" >university labs and experiments.</text><line x1="24" y1="124" x2="456" y2="124" stroke="#D9DFE6"/><text x="24" y="148" class="m" font-size="12" font-weight="600" fill="#00C9A7" text-anchor="start" >see all repositories →</text></svg>
