<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img"><defs><style>
.s{font-family:'Inter','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,ui-monospace,Menlo,monospace}
@keyframes flow{to{stroke-dashoffset:-20}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes rise{from{opacity:0}to{opacity:1}}
.ln{opacity:0;animation:rise .45s ease-out forwards}
@keyframes blink{50%{opacity:0}}.cur{animation:blink 1s step-end infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:900;animation:draw 4s ease-out infinite alternate}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:163}}
.ring{stroke-dasharray:163;animation:ring 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ln{opacity:1}}
</style><pattern id="fd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#465060" opacity=".55"/></pattern><radialGradient id="fg" cx="100%" cy="100%" r="65%"><stop offset="0" stop-color="#00C9A7" stop-opacity="0.3"/><stop offset="1" stop-color="#00C9A7" stop-opacity="0"/></radialGradient><clipPath id="cfd"><rect x="1" y="1" width="998" height="188" rx="20"/></clipPath></defs><g clip-path="url(#cfd)"><rect width="1000" height="190" fill="#0E1217"/><rect width="1000" height="190" fill="url(#fd)"/><rect width="1000" height="190" fill="url(#fg)"/></g><rect x="1" y="1" width="998" height="188" rx="20" fill="none" stroke="#222A35"/><text x="990" y="210" class="s" font-size="230" font-weight="800" fill="#E8EDF2" fill-opacity=".04" text-anchor="end" letter-spacing="-10">ken.</text><text x="48" y="86" class="s" font-size="32" font-weight="800" fill="#E8EDF2" text-anchor="start" letter-spacing="-1">Got something that has to be right?</text><text x="48" y="122" class="s" font-size="16.5" font-weight="400" fill="#8E99A6" text-anchor="start" >Backends, data pipelines, realtime systems. Telegram is the fastest way to reach me.</text><circle cx="54" cy="152" r="4" fill="#00C9A7" class="pulse"/><text x="68" y="157" class="m" font-size="12" font-weight="500" fill="#8E99A6" text-anchor="start" letter-spacing="2">KAZAKHSTAN · RU / KK / EN</text></svg>
